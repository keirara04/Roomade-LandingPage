services:
  roomade:
    build:
      context: .
      dockerfile: Dockerfile
    # `.env.local` is gitignored on purpose (it holds real secrets) and so
    # never exists in a fresh clone — pointing env_file at it broke deploy
    # platforms (Dokploy) that clone the repo fresh and inject these values
    # as real environment variables instead. ${VAR} substitution reads from
    # whatever already injected the vars into the environment (locally:
    # export them yourself, or run compose with --env-file .env.local).
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    restart: unless-stopped
