services:
  roomade:
    build:
      context: .
      dockerfile: Dockerfile
    # `.env.local` is gitignored on purpose (it holds real secrets) and so
    # never exists in a fresh clone — pointing env_file at it broke deploy
    # platforms (Dokploy) that clone the repo fresh and inject these values
    # as real environment variables instead. ${VAR} substitution reads from
    # whatever already injected the vars into the environment (locally:
    # export them yourself, or run compose with --env-file .env.local).
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
    # Not `ports:` — that binds the *host's* port 3000 directly, which is
    # what broke this on Dokploy (host port already taken by whatever else
    # is deployed on that VPS). Dokploy's Traefik reaches this service over
    # the internal Docker network by container port, via the app's Domains
    # tab, not a host bind. `expose` just documents the port to other
    # containers on the same network; it doesn't publish anything.
    #
    # For local testing without Dokploy in the loop, publish a port on the
    # `docker run`/`docker compose run` command line instead of baking one
    # in here, e.g.: docker compose run --service-ports -p 3099:3000 roomade
    expose:
      - "3000"
    restart: unless-stopped
