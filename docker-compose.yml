services:
  roomade:
    build:
      context: .
      dockerfile: Dockerfile
    # Reuses the same file `next dev` already reads, so there's one place
    # to set SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY instead of also needing
    # a `.env` (the filename Compose auto-loads) or exported shell vars.
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    restart: unless-stopped
